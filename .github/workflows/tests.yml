# 전체 시험과 작은 문서의 전수 검사. 전체 시험은 파이썬 3.11 과 3.13 에서 돌린다.
# cevsim 을 붙인 시험은 엔진의 소스(CEVSIM_HOME)가 있어야 하므로 여기서는 건너뛴다.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install pyevsim || echo "pyevsim 을 설치할 수 없다. 그 시험은 건너뛴다"
      - name: tests
        run: python -m pytest tests -q
      # 설치된 꾸러미가 묶음의 뼈대(templates/)를 함께 가졌는지를 본다. 저장소 밖에서 돌려야 설치된 것을 쓴다
      - name: the installed package makes and checks a pack
        run: |
          cd "$RUNNER_TEMP"
          ses pack new first
          ses pack new second --template full
          ses pack check second
          ses call pack_check --args '{"dir": "second"}'
      - name: mutant list matches the sources
        run: python tools/mutate.py --dry

  # 작은 문서의 전수 검사. 열한 묶음의 문서 73,693개를 빠짐없이 본다 (tests/bounded_docs.py).
  # 전체 시험은 그 가운데 23번째마다만 보므로 전부는 여기서 따로 돌린다.
  bounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: every small document
        run: python tools/bounded.py
