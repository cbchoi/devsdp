# 정의를 모델 베이스의 모듈에 잇는다. 결합 모델(Line)은 묶지 않는다. 문서의 구조에서 만들어진다.
# 대안(Fast, Slow)에 묶으면 그 대안을 고른 변이에서 쓰인다. 둘 다 같은 모듈이고 속성 service 의 값만 다르다.
binding: "1.0"
executor: devs
target: Line
time_unit: 1.0          # 모든 시간 전진이 이 값의 정수배다

map:
  Source: {module: Source}
  Fast: {module: Worker}
  Careful: {module: Worker}
  Slow: {module: Worker}
  Inspector: {module: Inspector}
  Sink: {module: Sink}
