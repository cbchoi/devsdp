# SES 공통 플랫폼의 파이썬 참조 구현 (ses_core) 과 명령줄 도구 ses.
# 설치: pip install .        시험까지: pip install ".[test]"
# docs/ses-platform/18_classic_parity.md 6절 참고.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ses-core"
version = "0.1.0"
description = "System Entity Structure common platform: canonical documents, pruning algebra, extensions, decision sets, executors"
readme = "docs/ses-platform/README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
schema = ["jsonschema>=4"]
pyevsim = ["pyevsim"]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
ses = "ses_core.cli:main"

[tool.setuptools]
packages = ["ses_core"]

[tool.setuptools.package-data]
ses_core = ["cevsim_bridge/*.cpp", "cevsim_bridge/*.hpp", "templates/full/*", "templates/full/cases/*"]
