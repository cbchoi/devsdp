# 가지치기 SES 예시 (접힌 형태)
# 가지치기 명세 자체가 SES다. 같은 스키마로 쓰고 같은 적재기로 읽는다.
# 각 엔티티 정의는 대상 SES에서 그 이름이 출현하는 모든 곳에 적용된다.
# 언급한 선택지만 남기고, 언급하지 않은 선택 지점은 제한하지 않는다.
# (07_pruning_algebra.md 참고)

ses: "1.0"
name: priority_4servers
description: 우선순위 버퍼와 서버 4대로 확정하는 가지치기 SES

entities:
  ProcessingSystem:
    root: true

  Buffer:
    specializations:
      policySpec:
        alternatives: [PriorityBuffer]

  PriorityBuffer:
    extends: Buffer

  ServerPool:
    multi_aspects:
      serversMAsp:
        part: Server
        cardinality: 4

  Server: {}
