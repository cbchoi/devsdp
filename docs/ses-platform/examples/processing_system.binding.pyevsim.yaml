# 바인딩 예시: 처리 시스템에 pyevsim 실행기를 붙인다 (15_pyevsim_executor.md 참고)
# 정의 이름을 pyevsim 모델베이스(examples/processing_pyevsim.py)의 모듈에 잇는다. 모듈의 본체는
# pyevsim의 모델(BehaviorModelExecutor)이다. 모듈의 이름과 인터페이스는 DEVS 바인딩
# (processing_system.binding.devs.yaml)의 것과 같으므로 같은 이름에 공통 모델베이스
# (examples/processing_mb.py)를 붙여도 된다. 결합 모델은 묶지 않는다. 실행기가 SES의 구조를
# 평탄화해 엔진의 연결로 등록한다.

binding: "1.0"
executor: pyevsim
target: ProcessingSystem

map:
  Generator: {module: Generator}
  FifoBuffer: {module: FifoBuffer}
  PriorityBuffer: {module: PriorityBuffer}
  Server: {module: Server}
  Collector: {module: Collector}
