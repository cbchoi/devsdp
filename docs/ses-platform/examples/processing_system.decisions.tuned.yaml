# 결정 집합 예시: 속성 값의 재정의 (18_classic_parity.md 4절)
# 변수 값으로 구조를 정하고, set 으로 만들어지는 구성요소의 속성 값을 바꾼다.
# set 은 선택이 아니다. 변이를 줄이지 않는다. 바뀐 값은 실행기의 계획에 매개변수로 실려 간다.

decisions: "1.0"
name: tuned_4servers
target: ProcessingSystem

variables:
  policy: priority
  num_servers: 4

set:
  # at: 그 정의가 준 값을 바꾼다. 그 정의가 구성원인 모든 구성요소에 미친다.
  - {at: Server, attribute: service_time, value: 3.0}
  # path: 그 구성요소 하나의 값을 바꾼다. 정의가 준 값보다 앞선다. 복제본마다 다른 값을 줄 때 쓴다.
  - {path: [ProcessingSystem, ServerPool, server_0], attribute: service_time, value: 1.0}
  - {path: [ProcessingSystem, ServerPool, server_3], attribute: service_time, value: 5.0}
